<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#556B4D">
  <title>Tuboco | Tu botánica de confianza</title>
  <link rel="icon" type="image/png" href="front/images/tuboco-logo.png">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="front/css/landing.css">
</head>
<body>
  <main id="app" class="shell" aria-live="polite"></main>
  <script>
    window.addEventListener('error', function () {
      var root = document.getElementById('app');
      if (root && !root.innerHTML.trim()) root.innerHTML = '<section class="center"><article class="card"><h1>No se pudo cargar Tuboco</h1><p class="hint">La aplicación encontró un error al iniciar. Recarga la página o revisa la consola del navegador.</p></article></section>';
    });
    window.addEventListener('unhandledrejection', function () {
      var root = document.getElementById('app');
      if (root && !root.innerHTML.trim()) root.innerHTML = '<section class="center"><article class="card"><h1>No se pudo conectar con Tuboco</h1><p class="hint">Comprueba que el servidor PHP y la base de datos estén activos e intenta recargar.</p></article></section>';
    });
  </script>
  <script type="module" src="front/js/main.js"></script>
</body>
</html>
